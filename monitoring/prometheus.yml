global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: worker
    static_configs:
      - targets: ["worker:8001"]
  - job_name: outbox
    static_configs:
      - targets: ["outbox:8002"]
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: mock-provider
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["mock-provider:9443"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: alert-sink
    static_configs:
      - targets: ["alert-sink:8080"]

rule_files:
  - alerts.yml
