events {}

http {
    # До 20 r/s на создание переводов с burst 40 — защита от случайного флуда/учений.
    limit_req_zone $binary_remote_addr zone=transfers:10m rate=20r/s;

    # Docker embedded DNS (127.0.0.11). Upstream задан переменной, чтобы nginx
    # перерезолвил api при каждом запросе: после пересоздания api (rolling
    # update) IP меняется, статичный upstream давал бы вечный 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        # Метрики НЕ публикуем наружу: Prometheus скрапит api:8000 напрямую
        # по внутренней сети. Наружу — только бизнес-API.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /metrics {
            return 404;
        }

        location = /health {
            set $api_upstream api;
            proxy_pass http://$api_upstream:8000;
        }

        location /transfers {
            limit_req zone=transfers burst=40 nodelay;
            set $api_upstream api;
            proxy_pass http://$api_upstream:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $request_id;
        }

        location / {
            set $api_upstream api;
            proxy_pass http://$api_upstream:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $request_id;
        }
    }
}
