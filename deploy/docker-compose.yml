name: payment-stack-${STACK_ENV:-stage}

services:
  vault:
    image: hashicorp/vault:1.18@sha256:750bb37c1638fa194ab37053a81618c61bb0491ddec6fccac87c07a8e6cd8166
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_DEV_ROOT_TOKEN:?FATAL: VAULT_DEV_ROOT_TOKEN is not set (see README)}"
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: "${VAULT_DEV_ROOT_TOKEN:?FATAL: VAULT_DEV_ROOT_TOKEN is not set (see README)}"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    env_file: ${RUNTIME_ENV_FILE:-runtime.stage.env}
    environment:
      POSTGRES_USER: payments
      POSTGRES_DB: payments
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  rabbitmq:
    image: rabbitmq:3.13-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    env_file: ${RUNTIME_ENV_FILE:-runtime.stage.env}
    environment:
      RABBITMQ_DEFAULT_USER: payments
      RABBITMQ_ENABLED_PLUGINS_FILE: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    # NOTE: management UI (15672) НЕ публикуем в base — только stage-overlay на 127.0.0.1.
    # Prometheus plugin (15692) слушает только compose-сеть; его скрапит prometheus.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migrator:
    image: northwind/payment-api:${APP_VERSION:-dev}
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    env_file: ${RUNTIME_ENV_FILE:-runtime.stage.env}
    environment:
      POSTGRES_USER: payments
      POSTGRES_DB: payments
    command: ["python", "-m", "app.migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles: ["tools"]

  api:
    image: northwind/payment-api:${APP_VERSION:-dev}
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    env_file: ${RUNTIME_ENV_FILE:-runtime.stage.env}
    environment:
      POSTGRES_USER: payments
      POSTGRES_DB: payments
      RABBITMQ_DEFAULT_USER: payments
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_VERSION: ${APP_VERSION:-dev}
      REQUIRE_IDEMPOTENCY_KEY: ${REQUIRE_IDEMPOTENCY_KEY:-true}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    image: northwind/payment-worker:${APP_VERSION:-dev}
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    env_file: ${RUNTIME_ENV_FILE:-runtime.stage.env}
    environment:
      POSTGRES_USER: payments
      POSTGRES_DB: payments
      RABBITMQ_DEFAULT_USER: payments
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - provider-certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mock-provider:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  outbox:
    image: northwind/payment-worker:${APP_VERSION:-dev}
    command: ["python", "-m", "worker.outbox"]
    env_file: ${RUNTIME_ENV_FILE:-runtime.stage.env}
    environment:
      POSTGRES_USER: payments
      POSTGRES_DB: payments
      RABBITMQ_DEFAULT_USER: payments
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STACK_ENV: ${STACK_ENV:-stage}
      BACKUP_METRICS_FILE: /metrics/backup-${STACK_ENV:-stage}.prom
    volumes:
      - ../.metrics:/metrics:ro
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mock-provider:
    image: northwind/mock-provider:${APP_VERSION:-dev}
    build:
      context: ..
      dockerfile: mock-provider/Dockerfile
    env_file: ${RUNTIME_ENV_FILE:-runtime.stage.env}
    volumes:
      - provider-certs:/certs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,ssl; urllib.request.urlopen('https://localhost:9443/health', context=ssl._create_unverified_context(), timeout=3)\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  reverse-proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${API_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  prometheus:
    image: prom/prometheus:v2.53.0@sha256:075b1ba2c4ebb04bc3a6ab86c06ec8d8099f8fda1c96ef6d104d9bb1def1d8bc
    # --web.enable-lifecycle: POST /-/reload после деплоя (alerts.yml — bind-mount).
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-lifecycle"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    # NOTE: 9090 НЕ публикуем в base. Для отладки — stage-overlay на 127.0.0.1:9090.
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  alert-sink:
    image: python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
    command: ["python", "/app/alert-sink.py"]
    volumes:
      - ../monitoring/alert-sink.py:/app/alert-sink.py:ro
    environment:
      ALERT_SINK_PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)\""]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      alert-sink:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9093/-/healthy >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    # NOTE: 9093 НЕ публикуем в base (как и 9090). Receiver — local alert-sink;
    # внешний pager/webhook подключается заменой URL в monitoring/alertmanager.yml.
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
  rabbitmq:
  provider-certs:
