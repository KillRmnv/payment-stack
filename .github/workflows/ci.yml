name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "ruff==0.17.6" pytest -r services/api/requirements.txt -r services/worker/requirements.txt
      - name: Lint
        run: |
          ruff check services mock-provider
          ruff format --check services mock-provider
      - name: Compose config (stage+prod)
        run: |
          touch deploy/runtime.env
          VAULT_DEV_ROOT_TOKEN=dummy-config-check docker compose --env-file deploy/env/stage.env -f deploy/docker-compose.yml -f deploy/compose.stage.yml config >/dev/null
          VAULT_DEV_ROOT_TOKEN=dummy-config-check docker compose --env-file deploy/env/prod.env -f deploy/docker-compose.yml -f deploy/compose.prod.yml config >/dev/null
      - name: No destructive commands
        run: '! grep -rnE "compose +down +-v|compose +down +.*--volumes" deploy scripts'
      - name: Test api
        run: PYTHONPATH=services/api pytest services/api/tests -q
      - name: Test worker
        run: PYTHONPATH=services/worker pytest services/worker/tests -q
