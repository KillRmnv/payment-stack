name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff pytest -r services/api/requirements.txt -r services/worker/requirements.txt
      - name: Lint
        run: ruff check services mock-provider
      - name: Compose config
        run: |
          touch deploy/runtime.env
          docker compose -f deploy/docker-compose.yml config
      - name: No destructive commands
        run: '! grep -rnE "compose +down +-v|compose +down +.*--volumes" deploy/*.sh scripts/*.sh'
      - name: Test api
        run: PYTHONPATH=services/api pytest services/api/tests -q
      - name: Test worker
        run: PYTHONPATH=services/worker pytest services/worker/tests -q
