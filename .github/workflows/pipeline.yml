name: pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test tooling
        run: pip install "ruff==0.17.6" pytest -r services/api/requirements.txt -r services/worker/requirements.txt
      - name: Lint
        run: |
          ruff check services mock-provider monitoring
          ruff format --check services mock-provider monitoring
      - name: Compose config (stage+prod)
        run: |
          touch deploy/runtime.stage.env deploy/runtime.prod.env
          VAULT_DEV_ROOT_TOKEN=dummy-config-check docker compose --env-file deploy/env/stage.env -f deploy/docker-compose.yml -f deploy/compose.stage.yml config >/dev/null
          VAULT_DEV_ROOT_TOKEN=dummy-config-check docker compose --env-file deploy/env/prod.env -f deploy/docker-compose.yml -f deploy/compose.prod.yml config >/dev/null
      - name: No destructive commands
        run: '! grep -rnE "compose +down +-v|compose +down +.*--volumes" deploy scripts'
      - name: Validate Prometheus/Alertmanager/nginx configs
        run: |
          docker run --rm -v "$PWD/monitoring:/m:ro" --entrypoint /bin/promtool prom/prometheus:v2.53.0@sha256:075b1ba2c4ebb04bc3a6ab86c06ec8d8099f8fda1c96ef6d104d9bb1def1d8bc check rules /m/alerts.yml
          docker run --rm -v "$PWD/monitoring:/m:ro" --entrypoint /bin/amtool prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5 check-config /m/alertmanager.yml
          docker run --rm -v "$PWD/deploy/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10 nginx -t
      - name: Actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: Test api
        run: PYTHONPATH=services/api pytest services/api/tests -q
      - name: Test worker
        run: PYTHONPATH=services/worker pytest services/worker/tests -q

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner (GHCR requires lowercase)
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images
        run: |
          SHA="$GITHUB_SHA"
          SHORT="$(git rev-parse --short=12 HEAD)"
          docker build -f services/api/Dockerfile -t "ghcr.io/$OWNER_LC/payment-api:$SHA" -t "ghcr.io/$OWNER_LC/payment-api:sha-$SHORT" .
          docker build -f services/worker/Dockerfile -t "ghcr.io/$OWNER_LC/payment-worker:$SHA" -t "ghcr.io/$OWNER_LC/payment-worker:sha-$SHORT" .
          docker build -f mock-provider/Dockerfile -t "ghcr.io/$OWNER_LC/mock-provider:$SHA" -t "ghcr.io/$OWNER_LC/mock-provider:sha-$SHORT" .
      - name: Trivy image scan (api)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          scan-ref: ghcr.io/${{ env.OWNER_LC }}/payment-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy image scan (worker)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          scan-ref: ghcr.io/${{ env.OWNER_LC }}/payment-worker:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy image scan (mock-provider)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          scan-ref: ghcr.io/${{ env.OWNER_LC }}/mock-provider:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          SHA="$GITHUB_SHA"
          SHORT="$(git rev-parse --short=12 HEAD)"
          for image in payment-api payment-worker mock-provider; do
            docker push "ghcr.io/$OWNER_LC/$image:$SHA"
            docker push "ghcr.io/$OWNER_LC/$image:sha-$SHORT"
          done
      - name: Release metadata
        id: meta
        run: |
          SHA="$GITHUB_SHA"
          SHORT="$(git rev-parse --short=12 HEAD)"
          echo "version=$SHA" >> "$GITHUB_OUTPUT"
          cat > release.env <<EOF
          APP_VERSION=$SHA
          SHORT_SHA=$SHORT
          API_IMAGE=ghcr.io/$OWNER_LC/payment-api:$SHA
          WORKER_IMAGE=ghcr.io/$OWNER_LC/payment-worker:$SHA
          MOCK_IMAGE=ghcr.io/$OWNER_LC/mock-provider:$SHA
          EOF
          cat release.env
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release.env
          retention-days: 30

  deploy-stage:
    needs: build-scan-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.STAGE_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, stage]
    environment: stage
    concurrency:
      group: deploy-stage
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DEPLOY_PATH: ${{ vars.STAGE_DEPLOY_PATH }}
      PAYMENT_STACK_PROJECT: ${{ vars.STAGE_PROJECT }}
      PAYMENT_STACK_RUNTIME_ENV: ${{ vars.STAGE_RUNTIME_ENV }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release
      - name: Deploy stage on self-hosted runner
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PATH" || { echo "FATAL: STAGE_DEPLOY_PATH is not set"; exit 1; }
          # shellcheck disable=SC1091
          . release/release.env
          test "$APP_VERSION" = "$GITHUB_SHA" || { echo "FATAL: release version mismatch"; exit 1; }
          cd "$DEPLOY_PATH"
          git fetch origin
          git checkout --force "$GITHUB_SHA"
          APP_VERSION="$APP_VERSION" make deploy ENV=stage
          make alert-selftest ENV=stage
          make smoke-idempotency ENV=stage

  deploy-prod:
    needs: deploy-stage
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, prod]
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH }}
      PAYMENT_STACK_PROJECT: ${{ vars.PROD_PROJECT }}
      PAYMENT_STACK_RUNTIME_ENV: ${{ vars.PROD_RUNTIME_ENV }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release
      - name: Deploy prod on self-hosted runner
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PATH" || { echo "FATAL: PROD_DEPLOY_PATH is not set"; exit 1; }
          # shellcheck disable=SC1091
          . release/release.env
          test "$APP_VERSION" = "$GITHUB_SHA" || { echo "FATAL: release version mismatch"; exit 1; }
          cd "$DEPLOY_PATH"
          git fetch origin
          git checkout --force "$GITHUB_SHA"
          APP_VERSION="$APP_VERSION" make deploy ENV=prod
          make alert-selftest ENV=prod
          make smoke-idempotency ENV=prod
