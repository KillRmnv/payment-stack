name: cd
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build all images (:sha)
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA="${{ github.sha }}"
          docker build -f services/api/Dockerfile -t ghcr.io/$OWNER_LC/payment-api:$SHA .
          docker build -f services/worker/Dockerfile -t ghcr.io/$OWNER_LC/payment-worker:$SHA .
          docker build -f mock-provider/Dockerfile -t ghcr.io/$OWNER_LC/mock-provider:$SHA .
          docker images ghcr.io/$OWNER_LC/payment-*:${{ github.sha }} ghcr.io/$OWNER_LC/mock-provider:${{ github.sha }}
      - name: Trivy image scan (api)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: image
          scan-ref: ghcr.io/${{ github.repository_owner }}/payment-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Trivy image scan (worker)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: image
          scan-ref: ghcr.io/${{ github.repository_owner }}/payment-worker:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Push :sha
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA="${{ github.sha }}"
          docker push ghcr.io/$OWNER_LC/payment-api:$SHA
          docker push ghcr.io/$OWNER_LC/payment-worker:$SHA
          docker push ghcr.io/$OWNER_LC/mock-provider:$SHA
