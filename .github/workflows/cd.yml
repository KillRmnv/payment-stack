name: cd
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner (GHCR requires lowercase)
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build all images (:sha)
        run: |
          SHA="${{ github.sha }}"
          docker build -f services/api/Dockerfile -t ghcr.io/$OWNER_LC/payment-api:$SHA .
          docker build -f services/worker/Dockerfile -t ghcr.io/$OWNER_LC/payment-worker:$SHA .
          docker build -f mock-provider/Dockerfile -t ghcr.io/$OWNER_LC/mock-provider:$SHA .
          docker images ghcr.io/$OWNER_LC/payment-api:$SHA
          docker images ghcr.io/$OWNER_LC/payment-worker:$SHA
          docker images ghcr.io/$OWNER_LC/mock-provider:$SHA
      - name: Trivy image scan (api)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          scan-ref: ghcr.io/${{ env.OWNER_LC }}/payment-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Trivy image scan (worker)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          scan-ref: ghcr.io/${{ env.OWNER_LC }}/payment-worker:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Push :sha
        run: |
          SHA="${{ github.sha }}"
          docker push ghcr.io/$OWNER_LC/payment-api:$SHA
          docker push ghcr.io/$OWNER_LC/payment-worker:$SHA
          docker push ghcr.io/$OWNER_LC/mock-provider:$SHA
