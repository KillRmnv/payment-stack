name: cd
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build api
        run: |
          TAG=ghcr.io/${{ github.repository_owner }}/payment-api:${{ github.sha }}
          docker build -f services/api/Dockerfile -t $TAG .
      - name: Build worker
        run: |
          TAG=ghcr.io/${{ github.repository_owner }}/payment-worker:${{ github.sha }}
          docker build -f services/worker/Dockerfile -t $TAG .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: services/
          severity: HIGH,CRITICAL
          exit-code: "1"
